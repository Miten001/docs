[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fb-finance-poster"
version = "1.0.0"
description = "Automated Facebook Finance Post Generator & Scheduler (FREE - $0/month)"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "pillow>=10.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pytest-mock"]

[project.scripts]
fb-poster = "fb_finance_poster.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
